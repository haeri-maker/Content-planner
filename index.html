<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠 플래너</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --labo:#c8306a; --labo-bg:#faedf3; --labo-bd:#e898c0; --labo-soft:#fdf5f9;
  --leps:#5030b8; --leps-bg:#eeeafa; --leps-bd:#b8a8ef; --leps-soft:#f5f2fd;
  --nuri:#0a7050; --nuri-bg:#e8f5f1; --nuri-bd:#9dd8c8; --nuri-soft:#f0faf7;
  --a:var(--labo); --a-bg:var(--labo-bg); --a-bd:var(--labo-bd); --a-soft:var(--labo-soft);
  --bg:#f9f5f7; --bg2:#fff; --bg3:#f4eef2; --bg4:#ecdae4;
  --bd:#eddde6; --bd2:#dfc8d4; --bd3:#c898ae;
  --tx:#2a1820; --tx2:#7a5068; --tx3:#b890a0;
  --r:11px; --rs:7px;
  --plan-c:#8a6200; --plan-bg:#fdf8e0; --plan-bd:#e8cc6a;
  --rec-c:#1a5a90;  --rec-bg:#e8f2fa;  --rec-bd:#90bce8;
  --cr-c:#c44d10;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sb{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:15px 15px 12px;border-bottom:1px solid var(--bd)}
.sb-logo-t{font-size:12.5px;font-weight:600;color:var(--tx);margin-bottom:10px}
.brand-btns{display:flex;flex-direction:column;gap:2px}
.bb{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--rs);cursor:pointer;font-size:12px;color:var(--tx2);border:1px solid transparent;transition:all .12s;background:none}
.bb:hover{background:var(--bg3)}
.bb.on-labo{background:var(--labo-soft);border-color:var(--labo-bd);color:var(--labo);font-weight:500}
.bb.on-leps{background:var(--leps-soft);border-color:var(--leps-bd);color:var(--leps);font-weight:500}
.bb.on-nuri{background:var(--nuri-soft);border-color:var(--nuri-bd);color:var(--nuri);font-weight:500}
.bdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bcnt{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--tx3)}
.sb-sec{padding:12px 8px 4px}
.sb-lbl{font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:0 8px;margin-bottom:3px}
.nav{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--rs);cursor:pointer;color:var(--tx2);font-size:12px;border:none;background:none;width:100%;text-align:left;transition:all .12s}
.nav:hover{background:var(--bg3);color:var(--tx)}
.nav.on{background:var(--a-bg);color:var(--tx);font-weight:500;border-left:2.5px solid var(--a);padding-left:7px}
.ndot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-budget{margin-top:auto;padding:12px 14px;border-top:1px solid var(--bd)}
.sb-br{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sb-brn{font-size:11px;display:flex;align-items:center;gap:5px}
.sb-brv{font-size:11px;font-family:'DM Mono',monospace;font-weight:500}
.sb-total{display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid var(--bd)}
.sb-total-l{font-size:11px;color:var(--tx2)}
.sb-total-v{font-size:15px;font-weight:600;font-family:'DM Mono',monospace}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;min-width:0}
.panel{display:none;padding:22px 24px}
.panel.on{display:block}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.pt{font-size:17px;font-weight:600;letter-spacing:-.02em}
.ps{font-size:11.5px;color:var(--tx2);margin-top:2px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.brand-strip{height:3px;border-radius:2px;margin-bottom:16px}

/* ── BTNS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;border:1px solid}
.btn-p{background:var(--a);color:#fff;border-color:var(--a)}
.btn-p:hover{opacity:.85}
.btn-g{background:transparent;color:var(--tx2);border-color:var(--bd2)}
.btn-g:hover{background:var(--bg3);color:var(--tx)}
.btn-d{background:transparent;color:#b03030;border-color:rgba(176,48,48,.2)}
.btn-d:hover{background:rgba(176,48,48,.06)}
.btn-xs{padding:2px 7px;font-size:10.5px}
.btn-sm{padding:4px 9px;font-size:11.5px}

/* ── FORMS ── */
.fg{display:grid;gap:9px;margin-bottom:9px}
.fg1{grid-template-columns:1fr}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.5px;color:var(--tx2);font-weight:500}
.field input,.field select,.field textarea{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:12.5px;padding:6px 9px;outline:none;transition:border-color .12s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--bd3);background:var(--bg2)}
.field textarea{resize:vertical;min-height:56px}

/* ── CALENDAR ── */
.cal-hd{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:6px}
.mlbl{font-size:14px;font-weight:500;min-width:80px;text-align:center}
.mbtn{width:26px;height:26px;background:var(--bg2);border:1px solid var(--bd2);color:var(--tx2);border-radius:var(--rs);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.mbtn:hover{background:var(--a-bg);color:var(--a);border-color:var(--a-bd)}

/* Legend */
#legend-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:10px}
#legend-items{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);position:relative;cursor:default}
.ldot{width:7px;height:7px;border-radius:50%}
.leg-x{display:none;position:absolute;right:-7px;top:-6px;width:13px;height:13px;border-radius:50%;background:#e24b4a;border:none;color:#fff;font-size:9px;cursor:pointer;align-items:center;justify-content:center;line-height:1}
.leg:hover .leg-x{display:flex}
.leg-add-btn{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;cursor:pointer;border:1px dashed var(--bd2);background:transparent;color:var(--tx2)}
.leg-add-btn:hover{border-color:var(--a);color:var(--a)}

/* Grid */
.cal-grid{display:grid;grid-template-columns:30px repeat(7,1fr);gap:3px}
.cal-dow{font-size:9.5px;color:var(--tx3);text-align:center;padding:3px 0;font-weight:500}
.wlbl{font-size:8.5px;color:var(--tx3);display:flex;align-items:flex-start;justify-content:flex-end;padding:5px 3px 0 0}
.cell{border-radius:8px;min-height:52px;border:1px solid var(--bd);background:var(--bg2);padding:4px 5px;cursor:pointer;transition:border-color .12s,background .12s;overflow:hidden;position:relative}
.cell:hover{border-color:var(--bd2);background:var(--bg3)}
.cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cell.c-plan{border-color:var(--plan-bd)!important;background:var(--plan-bg)}
.cell.c-recruit{border-color:var(--rec-bd)!important;background:var(--rec-bg)}
.cell.c-shoot{border-color:var(--a-bd)!important;background:var(--a-bg)}
.cell.c-today{outline:2px solid var(--a);outline-offset:-2px}
.cdate{font-size:9.5px;color:var(--tx3);margin-bottom:2px;font-family:'DM Mono',monospace}
.cell-thumb{width:100%;aspect-ratio:4/5;border-radius:4px;object-fit:cover;margin-bottom:3px;border:1px solid var(--bd);display:block}
.cell-thumb-zone{width:100%;aspect-ratio:4/5;border-radius:4px;border:1.5px dashed var(--bd2);margin-bottom:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;background:var(--bg3);font-size:8.5px;color:var(--tx3);gap:2px}
.cell-thumb-zone:hover{border-color:var(--a);color:var(--a);background:var(--a-bg)}
.chip{border-radius:4px;padding:2px 5px;margin-bottom:2px;font-size:9px;font-weight:500;display:block;line-height:1.35;cursor:pointer;transition:filter .1s}
.chip:hover{filter:brightness(.92)}
.chip-content{font-size:8px;color:var(--tx2);margin-top:1px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.chip-product{font-size:7.5px;color:var(--tx3);margin-top:1px}
.chip-ref{font-size:7.5px;display:block;margin-top:1px;text-decoration:none}
.wbar{font-size:8.5px;font-weight:600;text-transform:uppercase;padding:1px 4px;border-radius:3px;display:inline-block;margin-bottom:2px;letter-spacing:.04em}
.wb-plan{background:var(--plan-bg);color:var(--plan-c);border:0.5px solid var(--plan-bd)}
.wb-recruit{background:var(--rec-bg);color:var(--rec-c);border:0.5px solid var(--rec-bd)}
.ctime{font-size:8px;color:var(--tx3);margin-top:1px}

/* ── CONTEXT MENU ── */
.ctx{position:fixed;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);box-shadow:0 4px 24px rgba(0,0,0,.1);z-index:600;min-width:148px;padding:4px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);font-size:12px;cursor:pointer;color:var(--tx);transition:background .1s;border:none;background:none;width:100%;text-align:left}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.red{color:#b03030}
.ctx-item.red:hover{background:rgba(176,48,48,.07)}
.ctx-div{height:1px;background:var(--bd);margin:3px 0}

/* ── DAY POPUP ── */
.slot-pop{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:9px}
.sp-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px}
.sp-lbl{font-size:10.5px;color:var(--tx3);min-width:65px;flex-shrink:0;padding-top:1px}
.sp-val{font-size:12px;color:var(--tx);word-break:break-all;line-height:1.5}
.sp-val a{color:var(--nuri);text-decoration:none}
.sp-val a:hover{text-decoration:underline}
.pop-thumb{width:100%;max-height:190px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:block;margin-bottom:9px}
.paste-hint{border:2px dashed var(--bd2);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;margin-bottom:9px;color:var(--tx3);font-size:11px;transition:all .12s}
.paste-hint:hover{border-color:var(--a);color:var(--a);background:var(--a-bg)}

/* ── PASTE ZONE ── */
.pz{border:2px dashed var(--bd2);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;color:var(--tx3);transition:all .15s}
.pz:focus{outline:none;border-color:var(--a);background:var(--a-bg)}
.pz.has-img{border-style:solid;border-color:var(--bd2)}
.pz-img{width:100%;border-radius:5px;max-height:140px;object-fit:cover;border:1px solid var(--bd);display:block;margin-bottom:7px}
.pz kbd{background:var(--bg4);border:1px solid var(--bd2);border-radius:4px;padding:1px 5px;font-size:10px;font-family:'DM Mono',monospace}

/* ── MODAL ── */
.ov{display:none;position:fixed;inset:0;background:rgba(42,24,32,.4);z-index:300;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);width:560px;max-width:100%;max-height:90vh;overflow-y:auto;animation:mdin .15s ease;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.modal-lg{width:720px}
@keyframes mdin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mh{padding:13px 15px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:13.5px;background:var(--bg3);border-radius:var(--r) var(--r) 0 0;position:sticky;top:0;z-index:1}
.mb{padding:15px}
.mf{padding:11px 15px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end;background:var(--bg3);border-radius:0 0 var(--r) var(--r);position:sticky;bottom:0}
.xbtn{background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer;padding:1px 5px;border-radius:4px}
.xbtn:hover{color:var(--tx);background:var(--bg4)}

/* ── STATS / CARDS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px}
.stat-v{font-size:20px;font-weight:600;letter-spacing:-.03em;font-family:'DM Mono',monospace}
.stat-l{font-size:10.5px;color:var(--tx2);margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r)}
.card-h{padding:10px 13px;border-bottom:1px solid var(--bd);font-weight:500;font-size:12.5px;background:var(--bg3);border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:space-between;align-items:center}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--bg3)}
td{padding:7px 10px;border-bottom:1px solid var(--bd);color:var(--tx2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
td.tdn{color:var(--tx)}

/* ── CREATOR CARDS ── */
.cr-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cr-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;transition:border-color .12s}
.cr-card:hover{border-color:var(--bd2)}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:20px;font-size:9.5px;font-weight:500;border:1px solid;white-space:nowrap}
.b-plan{background:var(--plan-bg);color:var(--plan-c);border-color:var(--plan-bd)}
.b-recruit{background:var(--rec-bg);color:var(--rec-c);border-color:var(--rec-bd)}
.b-green{background:#eef5e6;color:#4a7a28;border-color:#a8d070}
.b-gray{background:var(--bg4);color:var(--tx2);border-color:var(--bd2)}
.b-brand{border:1px solid var(--a-bd);background:var(--a-bg);color:var(--a)}

/* ── SHOOT CARD ── */
.sh-cr-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 11px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}

/* ── MISC ── */
.empty{text-align:center;padding:28px;color:var(--tx3);font-size:12px}
.empty-i{font-size:22px;margin-bottom:7px}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sb">
  <div class="sb-logo">
    <div class="sb-logo-t">콘텐츠 플래너</div>
    <div class="brand-btns">
      <button class="bb" id="bb-labo" onclick="switchBrand('labo')">
        <div class="bdot" style="background:var(--labo)"></div>Laboreve
        <span class="bcnt" id="cnt-labo">0</span>
      </button>
      <button class="bb" id="bb-leps" onclick="switchBrand('leps')">
        <div class="bdot" style="background:var(--leps)"></div>LEPS
        <span class="bcnt" id="cnt-leps">0</span>
      </button>
      <button class="bb" id="bb-nuri" onclick="switchBrand('nuri')">
        <div class="bdot" style="background:var(--nuri)"></div>Nuriglow
        <span class="bcnt" id="cnt-nuri">0</span>
      </button>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">메뉴</div>
    <button class="nav on" data-p="calendar"><div class="ndot" style="background:var(--leps)"></div>캘린더</button>
    <button class="nav" data-p="creators"><div class="ndot" style="background:var(--cr-c)"></div>크리에이터</button>
    <button class="nav" data-p="budget"><div class="ndot" style="background:var(--plan-c)"></div>예산</button>
  </div>
  <div class="sb-budget">
    <div id="sb-brand-rows"></div>
    <div class="sb-total">
      <span class="sb-total-l">3개 브랜드 합산</span>
      <span class="sb-total-v" id="sb-grand">₩0</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<!-- CALENDAR -->
<div class="panel on" id="panel-calendar">
  <div class="ph">
    <div>
      <div class="pt" id="cal-title">Laboreve 캘린더</div>
      <div class="ps">10:00 KST = 뉴욕 9pm ET</div>
    </div>
    <div class="row">
      <div class="mnav">
        <button class="mbtn" id="prev-m">‹</button>
        <div class="mlbl" id="m-lbl"></div>
        <button class="mbtn" id="next-m">›</button>
      </div>
      <button class="btn btn-p" id="btn-add-slot">+ 슬롯 추가</button>
    </div>
  </div>
  <div class="brand-strip" id="brand-strip"></div>
  <div id="legend-wrap">
    <div id="legend-items"></div>
    <button class="leg-add-btn" onclick="openOv('ov-legend')">+ 범례</button>
  </div>
  <div id="cal-wrap"></div>
</div>

<!-- CREATORS -->
<div class="panel" id="panel-creators">
  <div class="ph">
    <div><div class="pt" id="cr-title">Laboreve 크리에이터</div><div class="ps">섭외 현황</div></div>
    <button class="btn btn-p" id="btn-add-cr">+ 추가</button>
  </div>
  <div class="stats" id="cr-stats"></div>
  <div class="cr-grid" id="cr-list"></div>
</div>

<!-- BUDGET -->
<div class="panel" id="panel-budget">
  <div class="ph">
    <div><div class="pt" id="budget-title">Laboreve 예산</div><div class="ps">크리에이터 + 기타 비용</div></div>
    <button class="btn btn-p" id="btn-add-exp">+ 비용 추가</button>
  </div>
  <div class="stats" id="budget-stats"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:4px">
    <div class="card"><div class="card-h">크리에이터 비용</div>
      <table><thead><tr><th>이름</th><th>촬영일</th><th>비용</th><th>상태</th></tr></thead>
      <tbody id="b-cr"></tbody></table></div>
    <div class="card"><div class="card-h">기타 비용</div>
      <table><thead><tr><th>항목</th><th>월</th><th>비용</th><th></th></tr></thead>
      <tbody id="b-exp"></tbody></table></div>
  </div>
</div>

</main>
</div>

<!-- ══ MODALS ══ -->

<!-- Day popup -->
<div class="ov" id="ov-day">
  <div class="modal modal-lg">
    <div class="mh"><span id="day-title">날짜 상세</span><button class="xbtn" data-close="ov-day">×</button></div>
    <div class="mb" id="day-body"></div>
    <div class="mf">
      <button class="btn btn-g" data-close="ov-day">닫기</button>
      <button class="btn btn-p" id="day-add-btn">+ 슬롯 추가</button>
    </div>
  </div>
</div>

<!-- Slot modal -->
<div class="ov" id="ov-slot">
  <div class="modal">
    <div class="mh"><span id="slot-title">슬롯 추가</span><button class="xbtn" data-close="ov-slot">×</button></div>
    <div class="mb">
      <div class="fg fg2">
        <div class="field"><label>날짜</label><input type="date" id="s-date"></div>
        <div class="field"><label>기본 유형</label>
          <select id="s-type">

<script>
/* ══ SUPABASE ══ */
const SB_URL = 'https://lndtrhoqkjmoorhcvxyq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZHRyaG9xa2ptb29yaGN2eHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjI2MjQsImV4cCI6MjA5MDk5ODYyNH0.-axQ5geQFEtLxRC33avGFC4K5oioovqb_qMhkVCA_jw';

/* ══ CONVERTERS ══ */
function s2db(s, brand) {
  return { id: s._id, brand, date: s.date, type: s.type, type_custom: s.typeCustom||'',
    title: s.title, time: s.time, ref: s.ref||'', ig_url: s.igUrl||'', tt_url: s.ttUrl||'', thumb: s.thumb,
    shoot_location: s.shootLocation, shoot_director: s.shootDirector,
    shoot_creators: s.shootCreators, memo: s.memo,
    content: s.content||'', product: s.product||'', upload_url: s.uploadUrl||'' };
}
function db2s(r) {
  return { _id: r.id, date: r.date||'', type: r.type||'ugc', typeCustom: r.type_custom||'',
    title: r.title||'', time: r.time||'', ref: r.ref||'', igUrl: r.ig_url||'', ttUrl: r.tt_url||'', thumb: r.thumb||'',
    shootLocation: r.shoot_location||'', shootDirector: r.shoot_director||'',
    shootCreators: r.shoot_creators||[], memo: r.memo||'',
    content: r.content||'', product: r.product||'', uploadUrl: r.upload_url||'' };
}
function c2db(c, brand) {
  return { id: c._id, brand, name: c.name, handle: c.handle, ig_url: c.ig,
    tt_url: c.tt, status: c.status, shoot_date: c.date, fee: c.fee,
    content_type: c.content, memo: c.memo };
}
function db2c(r) {
  return { _id: r.id, name: r.name||'', handle: r.handle||'', ig: r.ig_url||'',
    tt: r.tt_url||'', status: r.status||'new', date: r.shoot_date||'',
    fee: r.fee||0, content: r.content_type||'', memo: r.memo||'' };
}
function e2db(e, brand) {
  return { id: e._id, brand, name: e.name, month: e.month, amount: e.amount };
}
function db2e(r) {
  return { _id: r.id, name: r.name||'', month: r.month||'매월', amount: r.amount||0 };
}

/* ══ DB OPS ══ */
async function dbSave(table, row) {
  const { error } = await db.from(table).upsert(row, { onConflict: 'id' });
  if (error) console.error('save', table, error);
}
async function dbDel(table, id) {
  const { error } = await db.from(table).delete().eq('id', id);
  if (error) console.error('del', table, error);
}
async function loadDB() {
  const [s, c, e] = await Promise.all([
    db.from('slots').select('*'),
    db.from('creators').select('*'),
    db.from('expenses').select('*'),
  ]);
  ['labo','leps','nuri'].forEach(b => {
    D[b].slots    = (s.data||[]).filter(r => r.brand===b).map(db2s);
    D[b].creators = (c.data||[]).filter(r => r.brand===b).map(db2c);
    D[b].expenses = (e.data||[]).filter(r => r.brand===b).map(db2e);
  });
}
function setupRT() {
  db.channel('planner-slots')
    .on('postgres_changes', { event:'*', schema:'public', table:'slots' }, async (p) => {
      const b = p.new?.brand || p.old?.brand;
      if (!b) return;
      const { data } = await db.from('slots').select('*').eq('brand', b);
      if (data) D[b].slots = data.map(db2s);
      if (S.brand === b) renderCal();
      updateSB();
    })
    .subscribe();
}

/* ══ STATE ══ */
const BRANDS = {
  labo: { name:'Laboreve', c:'#c8306a', bg:'#faedf3', bd:'#e898c0', soft:'#fdf5f9' },
  leps: { name:'LEPS',     c:'#5030b8', bg:'#eeeafa', bd:'#b8a8ef', soft:'#f5f2fd' },
  nuri: { name:'Nuriglow', c:'#0a7050', bg:'#e8f5f1', bd:'#9dd8c8', soft:'#f0faf7' },
};
const D = {
  labo: { slots:[], creators:[], expenses:[] },
  leps: { slots:[], creators:[], expenses:[] },
  nuri: { slots:[], creators:[], expenses:[] },
};
const S = {
  brand: 'labo',
  curM: new Date().getMonth(),
  curY: new Date().getFullYear(),
  editSlotId: null, editCrId: null, dayDate: null,
  slotThumb: null,
};
const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const bd = () => D[S.brand];
const ML = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

/* ══ LEGEND ══ */
let LEGS = JSON.parse(localStorage.getItem('cp-legs')||'null') || [
  { id:'plan',    name:'기획',      color:'#8a6200' },
  { id:'recruit', name:'섭외',      color:'#1a5a90' },
  { id:'shoot',   name:'촬영일',    color:'#c8306a' },
  { id:'ugc',     name:'UGC',       color:'#0a7050' },
  { id:'meme',    name:'텍스트 밈', color:'#5030b8' },
  { id:'creator', name:'크리에이터',color:'#c44d10' },
];
function saveLegs() { localStorage.setItem('cp-legs', JSON.stringify(LEGS)); }
function renderLeg() {
  document.getElementById('legend-items').innerHTML = LEGS.map((l,i) =>
    `<div class="leg"><div class="ldot" style="background:${l.color}"></div><span>${l.name}</span>
     <button class="leg-x" onclick="delLeg(${i})">×</button></div>`
  ).join('');
  renderLegEdit();
}
function renderLegEdit() {
  const el = document.getElementById('leg-edit-list');
  if (!el) return;
  el.innerHTML = LEGS.map((l,i) =>
    '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg3);border-radius:var(--rs);border:1px solid var(--bd)">'
    + '<input type="color" value="'+l.color+'" onchange="LEGS['+i+'].color=this.value;saveLegs();renderLeg()" style="width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0;border-radius:4px">'
    + '<span style="flex:1;font-size:12px;font-weight:500">'+l.name+'</span>'
    + '<button class="btn btn-d btn-xs" onclick="delLeg('+i+');renderLegEdit()">삭제</button></div>'
  ).join('');
}
function delLeg(i) {
  if (!confirm("'"+LEGS[i].name+"' 범례를 삭제할까요?")) return;
  LEGS.splice(i,1); saveLegs(); renderLeg();
}
function addLegend() {
  const name = document.getElementById('leg-name').value.trim();
  const color = document.getElementById('leg-color').value;
  if (!name) return;
  LEGS.push({ id:'custom-'+Date.now(), name, color });
  saveLegs(); renderLeg();
  document.getElementById('leg-name').value = '';
}

/* ══ BRAND SWITCH ══ */
function switchBrand(b) {
  S.brand = b;
  const cfg = BRANDS[b];
  const r = document.documentElement.style;
  r.setProperty('--a', cfg.c);
  r.setProperty('--a-bg', cfg.bg);
  r.setProperty('--a-bd', cfg.bd);
  r.setProperty('--a-soft', cfg.soft);
  document.getElementById('brand-strip').style.background = cfg.c;
  document.querySelectorAll('.bb').forEach(el => {
    el.className = 'bb';
    if (el.id === 'bb-'+b) el.classList.add('on-'+b);
  });
  document.querySelectorAll('.nav').forEach(el => {
    if (el.classList.contains('on')) {
      el.classList.remove('on');
      el.classList.add('on');
    }
  });
  ['cal-title','cr-title','budget-title'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = cfg.name + ' ' + el.textContent.split(' ').slice(1).join(' ');
  });
  renderActive();
  updateSB();
}

/* ══ NAV ══ */
document.querySelectorAll('[data-p]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));

/* ══ MODALS ══ */
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeOv(b.dataset.close)));
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target===o) closeOv(o.id); }));
document.addEventListener('keydown', e => { if (e.key==='Escape') document.querySelectorAll('.ov.on').forEach(o => closeOv(o.id)); });
function openOv(id) { document.getElementById(id).classList.add('on'); }
function closeOv(id) { document.getElementById(id).classList.remove('on'); }

/* ══ THUMB ══ */
function readFile(f) { return new Promise(r => { const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(f); }); }
function applySlotThumb(data) {
  S.slotThumb = data;
  const img = document.getElementById('slot-pz-img');
  img.src = data; img.style.display = 'block';
  document.getElementById('slot-pz-hint').style.display = 'none';
  document.getElementById('slot-pz-act').style.display = '';
  document.getElementById('slot-pz').classList.add('has-img');
}
function clearSlotThumb(e) {
  if (e) e.stopPropagation();
  S.slotThumb = null;
  document.getElementById('slot-pz-img').style.display = 'none';
  document.getElementById('slot-pz-hint').style.display = '';
  document.getElementById('slot-pz-act').style.display = 'none';
  document.getElementById('slot-pz').classList.remove('has-img');
}
(function setupPZ() {
  const pz = document.getElementById('slot-pz');
  const fi = document.getElementById('slot-pz-file');
  pz.addEventListener('click', e => { if (e.target.tagName==='BUTTON') return; fi.click(); });
  fi.addEventListener('change', async e => { const f=e.target.files[0]; if(f) applySlotThumb(await readFile(f)); fi.value=''; });
  pz.addEventListener('dragover', e => { e.preventDefault(); pz.style.borderColor='var(--a)'; });
  pz.addEventListener('dragleave', () => pz.style.borderColor='');
  pz.addEventListener('drop', async e => { e.preventDefault(); pz.style.borderColor=''; const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) applySlotThumb(await readFile(f)); });
})();
document.addEventListener('paste', async e => {
  const img = Array.from(e.clipboardData?.items||[]).find(i=>i.type.startsWith('image/'));
  if (!img) return;
  const data = await readFile(img.getAsFile());
  if (document.getElementById('ov-slot').classList.contains('on')) {
    applySlotThumb(data);
  } else if (document.getElementById('ov-day').classList.contains('on') && S.dayDate) {
    const s = bd().slots.find(x=>x.date===S.dayDate&&!['plan','recruit'].includes(x.type));
    if (s) { s.thumb=data; dbSave('slots',s2db(s,S.brand)); renderCal(); openDayPop(S.dayDate); }
  }
});
async function uploadCellThumb(slotId, input) {
  const f = input.files[0]; if (!f) return;
  const data = await readFile(f);
  const s = bd().slots.find(x=>x._id===slotId);
  if (s) { s.thumb=data; dbSave('slots',s2db(s,S.brand)); renderCal(); if(S.dayDate) openDayPop(S.dayDate); }
}

document.getElementById('prev-m').addEventListener('click', () => {
  if (S.curM===0) { if(S.curY>2025){S.curM=11;S.curY--;renderCal();} }
  else { S.curM--; renderCal(); }

function tlbl(t) { return {ugc:'UGC',meme:'텍스트 밈',creator:'크리에이터 릴스',plan:'기획',recruit:'섭외',shoot:'촬영일'}[t]||t; }
function calcNY(t) { if(!t)return''; const[h,m]=t.split(':').map(Number); let nh=(h-13+24)%24; return`${nh%12||12}:${String(m).padStart(2,'0')} ${nh>=12?'pm':'am'}`; }
function thumbFor(s) { return s.thumb||null; }

function renderCal() {
  const m=S.curM, y=S.curY, slots=bd().slots;
  document.getElementById('m-lbl').textContent = ML[m]+' '+y;
  const rawFd = new Date(y,m,1).getDay();
  const fd = (rawFd+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  const today = new Date();
  let cells = [];
  for(let i=0;i<fd;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(d);
  while(cells.length%7) cells.push(null);

  let h = '<div class="cal-grid"><div></div>'
    + ['월','화','수','목','금','토','일'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  for(let w=0;w<cells.length/7;w++) {
    h += `<div class="wlbl">W${w+1}</div>`;
    cells.slice(w*7,w*7+7).forEach(day => {
      if (!day) { h+='<div class="cell empty"></div>'; return; }
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const slts = slots.filter(s=>s.date===ds);
      const isToday = today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===day;
      const hasPlan=slts.some(s=>s.type==='plan'), hasRec=slts.some(s=>s.type==='recruit'), hasShoot=slts.some(s=>s.type==='shoot');
      let cls = 'cell';
      if(hasPlan) cls+=' c-plan'; else if(hasRec) cls+=' c-recruit';
      if(hasShoot) cls+=' c-shoot';
      if(isToday) cls+=' c-today';
      const upSlts = slts.filter(s=>!['plan','recruit'].includes(s.type));
      const ft = upSlts.length ? thumbFor(upSlts[0]) : null;
      let inner = `<div class="cdate">${day}</div>`;
      if (ft) {
        inner += `<img class="cell-thumb" src="${ft}" alt="">`;
      } else if (upSlts.length) {
        inner += `<div class="cell-thumb-zone" onclick="triggerCellThumb('${upSlts[0]._id}',event)">
          <span style="font-size:12px">📋</span><span>썸네일</span>
          <input type="file" accept="image/*" style="display:none" onchange="uploadCellThumb('${upSlts[0]._id}',this)">
        </div>`;
      }
      slts.forEach(s => {
        if (s.type==='plan'||s.type==='recruit') {
          inner += `<div class="wbar wb-${s.type}">${s.type==='plan'?'기획':'섭외'}</div>`;
        } else {
          const disp = s.typeCustom || tlbl(s.type);
          const chipStyle = `background:var(--a-bg);color:var(--a);border:0.5px solid var(--a-bd)`;
          let extra = '';
          if(s.content) extra += `<div class="chip-content">${s.content}</div>`;
          if(s.product) extra += `<div class="chip-product">📦 ${s.product}</div>`;
          if(s.ref)     extra += `<a class="chip-ref" href="${s.ref}" target="_blank" onclick="event.stopPropagation()" style="color:var(--a)">🔗 레퍼런스</a>`;
          if(s.igUrl)   extra += `<a class="chip-ref" href="${s.igUrl}" target="_blank" onclick="event.stopPropagation()" style="color:#c8306a">📸 IG</a>`;
          if(s.ttUrl)   extra += `<a class="chip-ref" href="${s.ttUrl}" target="_blank" onclick="event.stopPropagation()" style="color:#111">🎵 TT</a>`;
          if(s.uploadUrl) extra += `<a class="chip-ref" href="${s.uploadUrl}" target="_blank" onclick="event.stopPropagation()" style="color:#0a7050;font-weight:500">📤 업로드 링크</a>`;
          inner += `<div class="chip" data-sid="${s._id}" style="${chipStyle}" oncontextmenu="showCtx(event,'${s._id}')">${disp}${extra}</div>`;
        }
      });
      if(upSlts.some(s=>s.time)) inner += `<div class="ctime">10:00 KST · NY ${calcNY('10:00')}</div>`;
      h += `<div class="${cls}" data-date="${ds}">${inner}</div>`;
    });
  }
  h += '</div>';
  const w = document.getElementById('cal-wrap');
  w.innerHTML = h;
  w.querySelectorAll('.cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', e => {
      if (e.target.closest('.chip')||e.target.closest('.cell-thumb-zone')) return;
      openDayPop(cell.dataset.date);
    });
  });
  w.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', e => { e.stopPropagation(); openSlotEdit(chip.dataset.sid); });
  });
}
function triggerCellThumb(id, e) {
  e.stopPropagation();
  const inp = e.currentTarget.querySelector('input[type=file]');
  if(inp) inp.click();
}

function openDayPop(date) {

  const hasPlan = bd().slots.some(s=>s.date===date&&s.type==='plan');
  const hasRec  = bd().slots.some(s=>s.date===date&&s.type==='recruit');
  let h = '';
  if(hasPlan) h += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <span class="badge b-plan">기획 주간</span>
    <button class="btn btn-d btn-xs" onclick="delTypeSlots('${date}','plan')">삭제</button></div>`;
  if(hasRec) h += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <span class="badge b-recruit">섭외 주간</span>
    <button class="btn btn-d btn-xs" onclick="delTypeSlots('${date}','recruit')">삭제</button></div>`;
  if(!slts.length&&!hasPlan&&!hasRec) h = '<div class="empty"><div class="empty-i">📭</div>등록된 슬롯이 없어요</div>';
  slts.forEach(s => {
    const isShoot = s.type==='shoot';
    const thumb = thumbFor(s);
    let thumbHtml = thumb
      ? `<img class="pop-thumb" src="${thumb}" alt="">`
      : !isShoot ? `<div class="paste-hint" onclick="triggerDayThumb('${s._id}')">
          📋 Ctrl+V 붙여넣기 또는 클릭해서 이미지 선택
          <input type="file" accept="image/*" style="display:none" onchange="uploadCellThumb('${s._id}',this)">
        </div>` : '';
    let det = '';
    if(isShoot) {
      const crs = (s.shootCreators||[]).map(cid => {
        const cr = bd().creators.find(x=>x._id===cid);
        return cr ? `<div class="sh-cr-card"><div><span style="font-weight:500">${cr.name}</span> <span style="font-size:10px;color:var(--tx2)">${cr.handle}</span>${cr.content?`<div style="font-size:10px;color:var(--tx3)">${cr.content}</div>`:''}</div><span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--cr-c)">${cr.fee?'₩'+cr.fee.toLocaleString():'미정'}</span></div>` : '';
      }).join('');
      const tot = (s.shootCreators||[]).reduce((t,cid)=>{const cr=bd().creators.find(x=>x._id===cid);return t+(cr?.fee||0);},0);
      det = `<div class="sp-row"><div class="sp-lbl">촬영 시간</div><div class="sp-val">${s.time||'—'}</div></div>
        ${s.shootLocation?`<div class="sp-row"><div class="sp-lbl">장소</div><div class="sp-val">${s.shootLocation}</div></div>`:''}
        ${s.shootDirector?`<div class="sp-row"><div class="sp-lbl">담당</div><div class="sp-val">${s.shootDirector}</div></div>`:''}
        ${s.memo?`<div class="sp-row"><div class="sp-lbl">메모</div><div class="sp-val" style="color:var(--tx2)">${s.memo}</div></div>`:''}
        ${crs?`<div class="sp-row" style="flex-direction:column;align-items:stretch"><div class="sp-lbl" style="margin-bottom:5px">크리에이터</div>${crs}</div>`:''}
        ${tot?`<div style="padding:7px 10px;background:var(--plan-bg);border:1px solid var(--plan-bd);border-radius:var(--rs);display:flex;justify-content:space-between;margin-top:5px"><span style="font-size:11px;color:var(--plan-c)">합산</span><span style="font-family:'DM Mono',monospace;font-weight:600;color:var(--plan-c)">₩${tot.toLocaleString()}</span></div>`:''}`;
    } else {
      det = `<div class="sp-row"><div class="sp-lbl">제목</div><div class="sp-val">${s.title||'—'}</div></div>
        ${s.typeCustom?`<div class="sp-row"><div class="sp-lbl">유형</div><div class="sp-val">${s.typeCustom}</div></div>`:''}
        ${s.content?`<div class="sp-row"><div class="sp-lbl">내용</div><div class="sp-val">${s.content}</div></div>`:''}
        ${s.product?`<div class="sp-row"><div class="sp-lbl">제품</div><div class="sp-val">${s.product}</div></div>`:''}
        ${s.time?`<div class="sp-row"><div class="sp-lbl">업로드</div><div class="sp-val">${s.time} KST · NY ${calcNY(s.time)}</div></div>`:''}
        ${s.ref?`<div class="sp-row"><div class="sp-lbl">레퍼런스</div><div class="sp-val"><a href="${s.ref}" target="_blank" style="color:var(--a)">🔗 링크 ↗</a></div></div>`:''}
        ${s.igUrl||s.ttUrl?`<div class="sp-row"><div class="sp-lbl">업로드</div><div class="sp-val" style="display:flex;gap:10px;flex-wrap:wrap">
          ${s.igUrl?`<a href="${s.igUrl}" target="_blank" style="color:#c8306a;font-weight:500">📸 Instagram ↗</a>`:''}
          ${s.ttUrl?`<a href="${s.ttUrl}" target="_blank" style="color:#111;font-weight:500">🎵 TikTok ↗</a>`:''}</div></div>`:''}
        ${s.uploadUrl?`<div class="sp-row"><div class="sp-lbl">업로드 링크</div><div class="sp-val"><a href="${s.uploadUrl}" target="_blank" style="color:#0a7050;font-weight:500">${s.uploadUrl.length>50?s.uploadUrl.slice(0,50)+'…':s.uploadUrl} ↗</a></div></div>`:''}`;
    }
    h += `<div class="slot-pop">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="badge b-brand">${tlbl(s.type)}</span>

        </div>
      </div>
      ${thumbHtml}${det}</div>`;
  });
  document.getElementById('day-body').innerHTML = h;
  openOv('ov-day');
}

let _ctxId = null;
function showCtx(e, id) {
  e.preventDefault(); e.stopPropagation();
  _ctxId = id;
  const ctx = document.getElementById('ctx');
  ctx.style.display = 'block';
  const x=Math.min(e.clientX, window.innerWidth-160);
  const y=Math.min(e.clientY, window.innerHeight-180);
  ctx.style.left=x+'px'; ctx.style.top=y+'px';
}
function hideCtx() { document.getElementById('ctx').style.display='none'; }
document.addEventListener('click', e => { if (!e.target.closest('#ctx')) hideCtx(); });
let _moveId = null;
function ctxDo(action) {
  const id = _ctxId;   // 먼저 저장
  hideCtx();
  if(!id) return;
  const s=bd().slots.find(x=>x._id===id); if(!s) return;
  if(action==='detail') { openDayPop(s.date); }
  else if(action==='edit') { openSlotEdit(id); }
  else if(action==='dupe') {
    const n={...s,_id:gid()};
    bd().slots.push(n);
    dbSave('slots',s2db(n,S.brand));
    renderCal();
  }
  else if(action==='move') {
    _moveId = id;
    document.getElementById('move-date').value = s.date;
    openOv('ov-move');
  }
  else if(action==='del') {
    if(!confirm('삭제할까요?')) return;
    D[S.brand].slots=bd().slots.filter(x=>x._id!==id);
    dbDel('slots',id); renderCal();
  }
}
function confirmMove() {
  const newDate=document.getElementById('move-date').value;
  if(!newDate||!_moveId) return;
  const s=bd().slots.find(x=>x._id===_moveId); if(!s) return;
  s.date=newDate;
  dbSave('slots',s2db(s,S.brand));
  closeOv('ov-move'); _moveId=null; _ctxId=null; renderCal();
}

function renderCreators() {
  const crs=bd().creators;
  const sl={new:'미접촉',contact:'연락중',confirmed:'확정',done:'완료'};
  const sb={new:'b-gray',contact:'b-recruit',confirmed:'b-green',done:'b-green'};
  const tot=crs.reduce((s,c)=>s+(c.fee||0),0);
  document.getElementById('cr-stats').innerHTML=`
    <div class="stat"><div class="stat-v">${crs.length}</div><div class="stat-l">전체</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--nuri)">${crs.filter(c=>c.status==='confirmed'||c.status==='done').length}</div><div class="stat-l">확정/완료</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--rec-c)">${crs.filter(c=>c.status==='contact').length}</div><div class="stat-l">연락중</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--cr-c)">₩${tot.toLocaleString()}</div><div class="stat-l">총 비용</div></div>`;
  if(!crs.length){document.getElementById('cr-list').innerHTML='<div class="empty"><div class="empty-i">🎬</div>크리에이터를 추가해보세요</div>';return;}
  document.getElementById('cr-list').innerHTML=crs.map(c=>`
    <div class="cr-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:7px">
        <div><div style="font-size:14px;font-weight:500">${c.name}</div><div style="font-size:11px;color:var(--tx2)">${c.handle}</div></div>
        <span class="badge ${sb[c.status]}">${sl[c.status]}</span>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px">
        ${c.ig?`<a href="${c.ig}" target="_blank" style="font-size:10px;font-weight:500;color:#c8306a;text-decoration:none;padding:2px 9px;border:1px solid #e898c0;border-radius:20px;background:#faedf3">📸 IG ↗</a>`:'<span style="font-size:10px;color:var(--tx3);padding:2px 7px;border:1px dashed var(--bd2);border-radius:20px">IG 미등록</span>'}
        ${c.tt?`<a href="${c.tt}" target="_blank" style="font-size:10px;font-weight:500;color:#111;text-decoration:none;padding:2px 9px;border:1px solid #ccc;border-radius:20px;background:#f5f5f5">🎵 TT ↗</a>`:'<span style="font-size:10px;color:var(--tx3);padding:2px 7px;border:1px dashed var(--bd2);border-radius:20px">TT 미등록</span>'}
      </div>
      ${c.content?`<div style="margin-bottom:5px"><span class="badge" style="background:var(--a-bg);color:var(--a);border-color:var(--a-bd)">${c.content}</span></div>`:''}
      ${c.date?`<div style="font-size:11px;color:var(--tx2);margin-bottom:4px">촬영: ${c.date}</div>`:''}
      <div style="font-size:13px;font-weight:500;color:var(--cr-c);font-family:'DM Mono',monospace">${c.fee?'₩'+c.fee.toLocaleString():'미정'}</div>
      ${c.memo?`<div style="font-size:11px;color:var(--tx3);margin-top:6px;line-height:1.5">${c.memo}</div>`:''}
      <div style="display:flex;gap:5px;margin-top:9px">
        <button class="btn btn-g btn-sm" onclick="openCrModal('${c._id}')">편집</button>
        <button class="btn btn-d btn-sm" onclick="delCr('${c._id}')">삭제</button>
      </div>
    </div>`).join('');
}
function delCr(id){if(!confirm('삭제?'))return;D[S.brand].creators=bd().creators.filter(c=>c._id!==id);dbDel('creators',id);renderCreators();updateSB();}

/* ══ BUDGET ══ */
document.getElementById('btn-add-exp').addEventListener('click', () => {
  ['e-name','e-amount'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('e-month').value='5월';
  openOv('ov-exp');
});
document.getElementById('save-exp-btn').addEventListener('click', () => {
  const name=document.getElementById('e-name').value,month=document.getElementById('e-month').value,amount=parseInt(document.getElementById('e-amount').value)||0;
  if(!name) return;
  const obj={_id:gid(),name,month,amount};
  bd().expenses.push(obj);
  dbSave('expenses',e2db(obj,S.brand));
  closeOv('ov-exp'); renderBudget(); updateSB();
});
function renderBudget() {
  const d=bd();
  const cr=d.creators.reduce((s,c)=>s+(c.fee||0),0);
  const exp=d.expenses.reduce((s,e)=>s+(e.amount||0),0);
  document.getElementById('budget-stats').innerHTML=`
    <div class="stat"><div class="stat-v" style="color:var(--cr-c)">₩${cr.toLocaleString()}</div><div class="stat-l">크리에이터</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--leps)">₩${exp.toLocaleString()}</div><div class="stat-l">기타</div></div>
    <div class="stat"><div class="stat-v">₩${(cr+exp).toLocaleString()}</div><div class="stat-l">합산</div></div>
    <div class="stat"><div class="stat-v" style="color:var(--tx3)">${d.creators.length}</div><div class="stat-l">크리에이터 수</div></div>`;
  const sl={new:'미접촉',contact:'연락중',confirmed:'확정',done:'완료'};
  const sb={new:'b-gray',contact:'b-recruit',confirmed:'b-green',done:'b-green'};
  document.getElementById('b-cr').innerHTML=!d.creators.length
    ?`<tr><td colspan="4" style="text-align:center;padding:14px;color:var(--tx3)">없음</td></tr>`
    :d.creators.map(c=>`<tr><td class="tdn">${c.name}</td><td style="font-size:11px">${c.date||'—'}</td><td style="font-family:'DM Mono',monospace;color:var(--cr-c)">₩${(c.fee||0).toLocaleString()}</td><td><span class="badge ${sb[c.status]}">${sl[c.status]}</span></td></tr>`).join('');
  document.getElementById('b-exp').innerHTML=!d.expenses.length
    ?`<tr><td colspan="4" style="text-align:center;padding:14px;color:var(--tx3)">없음</td></tr>`
    :d.expenses.map(e=>`<tr><td class="tdn">${e.name}</td><td>${e.month}</td><td style="font-family:'DM Mono',monospace;color:var(--leps)">₩${(e.amount||0).toLocaleString()}</td><td><button class="btn btn-d btn-xs" onclick="delExp('${e._id}')">×</button></td></tr>`).join('');
}
function delExp(id){D[S.brand].expenses=bd().expenses.filter(e=>e._id!==id);dbDel('expenses',id);renderBudget();updateSB();}

/* ══ SIDEBAR ══ */
function brandTotal(b){return D[b].creators.reduce((s,c)=>s+(c.fee||0),0)+D[b].expenses.reduce((s,e)=>s+(e.amount||0),0);}
function updateSB() {
  const tots={labo:brandTotal('labo'),leps:brandTotal('leps'),nuri:brandTotal('nuri')};
  const grand=Object.values(tots).reduce((s,v)=>s+v,0);
  document.getElementById('sb-grand').textContent='₩'+grand.toLocaleString();
  document.getElementById('sb-brand-rows').innerHTML=Object.entries(BRANDS).map(([b,cfg])=>
    `<div class="sb-br"><div class="sb-brn"><div class="bdot" style="background:${cfg.c}"></div>${cfg.name}</div><div class="sb-brv" style="color:${cfg.c}">₩${tots[b].toLocaleString()}</div></div>`
  ).join('');
  ['labo','leps','nuri'].forEach(b=>{
    document.getElementById('cnt-'+b).textContent=D[b].slots.filter(s=>!['plan','recruit'].includes(s.type)).length;
  });
}

/* ══ INIT ══ */
(async ()=>{
  renderLeg();
  switchBrand('labo');
  await loadDB();
  switchBrand('labo');
  setupRT();
})();
</script>
